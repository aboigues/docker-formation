name: Rebuild Hardened Images

# Reconstruit et republie les images durcies de hardened/ (grafana, cadvisor).
#
# POURQUOI CE WORKFLOW EXISTE
#
# Un durcissement est une PHOTO, pas un état. `apk upgrade` applique les
# correctifs disponibles le jour du build ; dès que la distribution en publie
# d'autres, l'image publiée redevient en retard sans que rien n'ait changé
# dans le dépôt (voir hardened/README.md). Sans ce workflow, chaque scan rouge
# demanderait un rebuild manuel — et c'est le scan hebdomadaire qui servirait
# de rappel, donc toujours a posteriori.
#
# COMPLÉMENTAIRE de image-scan.yml, PAS REDONDANT : ce workflow répare l'amont
# des 2 images qu'on maîtrise, le scan constate l'état de TOUTES les images
# des TP.

on:
  schedule:
    # Le 1er de chaque mois à 04:00 UTC, soit deux heures avant le premier
    # scan hebdomadaire possible (lundi 06:00 UTC, cf. image-scan.yml) : quand
    # le scan passe, les images fraîchement publiées sont déjà en place.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publier les images sur Docker Hub'
        type: boolean
        default: true
  # Sur modification des sources durcies, pour valider le build sans publier.
  push:
    branches: [ main ]
    paths:
      - 'hardened/**'
      - '.github/workflows/rebuild-hardened-images.yml'

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild and publish hardened images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (émulation arm64 pour le build multi-arch)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Un push sur une branche ne publie jamais : il valide seulement que les
      # Dockerfiles construisent encore et mesure la dérive.
      - name: Decide whether to publish
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            publish=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish="${{ inputs.push }}"
          else
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publication : $publish"

      # Échec explicite plutôt qu'un `docker push` qui échouerait après un
      # build multi-arch de plusieurs minutes : les secrets manquants sont une
      # erreur de configuration du dépôt, pas un incident de sécurité.
      - name: Check Docker Hub credentials
        if: steps.mode.outputs.publish == 'true'
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "❌ Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents."
            echo "   Les créer dans Settings → Secrets and variables → Actions,"
            echo "   avec un token ayant le droit d'écriture sur l'org telemachlearning."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, measure and publish
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=""
          [ "${{ steps.mode.outputs.publish }}" = "true" ] && args="--push"

          # build.sh sort en 1 si une image garde des CVE OS corrigeables. Le
          # code est mis de côté le temps d'écrire le résumé : `set -e`
          # couperait le rapport au moment précis où il a quelque chose à dire.
          set +e
          ./hardened/build.sh $args 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e

          {
            echo "## Reconstruction des images durcies"
            echo ""
            echo "Publication : \`${{ steps.mode.outputs.publish }}\`"
            echo ""
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ne 0 ]; then
            {
              echo ""
              echo "> ⚠️ Une image au moins garde des **CVE OS corrigeables** après"
              echo "> \`apk upgrade\`. La barrière de \`image-scan.yml\` bloquera"
              echo "> dessus au prochain scan."
              echo ">"
              echo "> Un durcissement qui ne suffit plus veut souvent dire que"
              echo "> l'amont a bougé : vérifier s'il existe un tag plus récent"
              echo "> **en mesurant**, un bump pouvant aggraver (voir"
              echo "> \`hardened/README.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"
